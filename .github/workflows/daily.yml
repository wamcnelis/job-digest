name: Daily job digest

on:
  schedule:
    - cron: "0 13 * * *"   # 6am Pacific (13:00 UTC; 5am during winter time)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch jobs and build page
        run: python3 -u jobs.py
      - name: Publish
        run: |
          git config user.name "job-digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html seen.json
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
